map $http_x_forwarded_proto $fproto { default $http_x_forwarded_proto; "" $scheme; }
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $fproto;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location = /manifest.webmanifest { default_type application/manifest+json; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /config.json { add_header Cache-Control "no-store"; }
  # Always revalidate code/markup so CDN or browser caches never serve a stale UI
  location ~* \.(?:js|css|html|webmanifest)$ { add_header Cache-Control "no-cache"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
