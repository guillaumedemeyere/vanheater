<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van Heater (e-reader)</title>
<!-- Plain ES5 page for old e-reader browsers (Kobo): no modules, no fetch, no Promise, no CSS variables, no grid/flex.
     Read-only: temperatures and alarm status. Polls with XMLHttpRequest. High contrast with a few deep colours. -->
<style>
html,body{margin:0;padding:0;background:#fff;color:#000}
body{font:500 20px/1.25 Helvetica,Arial,sans-serif;padding:10px;text-align:center}
.status{border:3px solid #000;border-top-width:12px;padding:6px 12px;margin-bottom:10px}
.status.ok{border-color:#00702e}
.status.warn{border-color:#b35c00}
.status.alarm{border-color:#c00000}
.status .big{font-size:34px;font-weight:700}
.status.ok .big{color:#00702e}
.status.warn .big{color:#b35c00}
.status.alarm .big{color:#c00000}
.status ul{margin:4px 0 0;padding:0;list-style:none;font-size:22px}
table.g{width:100%;border-collapse:separate;border-spacing:8px;margin:-8px 0 2px;table-layout:fixed}
table.g td{border:3px solid #000;padding:4px 6px;vertical-align:middle}
.hero td{border-top-width:10px;padding:6px 6px 8px}
.hero td.a{border-top-color:#b23a00}
.hero td.b{border-top-color:#0a2fa8}
.lbl{font-size:17px;color:#222;text-transform:uppercase;letter-spacing:1px}
.temp{font-size:84px;line-height:1.05;font-weight:700}
.hero td.a .temp{color:#b23a00}
.hero td.b .temp{color:#0a2fa8}
.sub{font-size:17px;color:#222}
.tile .val{font-size:30px;font-weight:700;line-height:1.15}
.tile .u{font-size:17px;font-weight:500}
.chart{border:3px solid #000;margin:2px 0 10px;padding:6px 4px 4px}
.tabs{margin:2px 0 6px}
.tabs button,.tabs select{font:600 18px Helvetica,Arial,sans-serif;border:3px solid #000;background:#fff;color:#000;padding:4px 10px;margin:0 3px}
.tabs button.on{background:#0a2fa8;border-color:#0a2fa8;color:#fff}
.log{margin:4px 0 10px;padding:0;list-style:none;font-size:18px}
.log li{border-bottom:1px solid #000;padding:3px 2px}
.foot{font-size:18px;color:#222}
.foot select,.foot button{font:600 18px Helvetica,Arial,sans-serif;border:3px solid #000;background:#fff;color:#000;padding:4px 8px;margin-left:6px}
.foot button{background:#0a2fa8;color:#fff;border-color:#0a2fa8}
</style>
</head>
<body>
<div id="status" class="status warn"><div class="big" id="sbig">Loading...</div><ul id="slist"></ul></div>

<table class="g hero"><tr>
  <td class="a"><div class="lbl">Cabin</div><div class="temp" id="temp">--</div><div class="sub" id="tsub">&nbsp;</div></td>
  <td class="b"><div class="lbl" id="tlbl">Target</div><div class="temp" id="tgt">--</div><div class="sub" id="gsub">&nbsp;</div></td>
</tr></table>

<table class="g tile" id="tiles"></table>

<div class="chart">
  <div class="tabs" id="tabs"></div>
  <div id="chart"></div>
  <div class="tabs" id="ranges"></div>
</div>

<div class="lbl">Recent alarm events</div>
<ul class="log" id="log"></ul>
<div class="foot">
  <span id="upd">not updated yet</span><br>
  Update every
  <select id="every"><option value="15">15 s</option><option value="30">30 s</option><option value="60">1 min</option><option value="300">5 min</option></select>
  <button id="now" type="button">Now</button>
</div>
<script>
(function () {
  var timer = null, cfg = null, hist = null, curSeries = 'cabin', curRange = '4h', lastValues = {};
  var SERIES = [['cabin', 'Cabin'], ['battery', 'Battery'], ['body', 'Heater body'], ['pump', 'Pump']];
  var RANGES = [['1h', '1 h'], ['4h', '4 h'], ['day', '24 h'], ['week', '7 days']];

  function $(id) { return document.getElementById(id); }
  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var j = null;
      if (x.status === 200) { try { j = JSON.parse(x.responseText); } catch (e) { j = null; } }
      cb(j);
    };
    x.send();
  }
  function num(v, d) { return (typeof v === 'number') ? v.toFixed(d) : '--'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function pad(n) { return ('0' + n).slice(-2); }
  function hm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function since(ms) {
    var s = Math.max(0, Math.round((new Date().getTime() - ms) / 1000));
    if (s < 90) { return s + ' s ago'; }
    if (s < 5400) { return Math.round(s / 60) + ' min ago'; }
    return Math.round(s / 3600) + ' h ago';
  }
  function tile(label, val, unit) {
    return '<td><div class="lbl">' + label + '</div><div class="val">' + val + (unit ? ' <span class="u">' + unit + '</span>' : '') + '</div></td>';
  }
  function trow(a, b) { return '<tr>' + a + b + '</tr>'; }

  function render(state, alarms) {
    var v = (state && state.values) || {};
    lastValues = v;
    var age = state ? (new Date().getTime() - (state.lastMsg || 0)) / 1000 : 1e9;
    var offline = !state || !state.online || age > 300;
    var active = (alarms && alarms.active) || [];
    var s = $('status'), list = '', i;
    if (!state) {
      s.className = 'status warn'; $('sbig').innerHTML = 'Server not reachable';
    } else if (active.length) {
      s.className = 'status alarm'; $('sbig').innerHTML = 'ALARM';
      for (i = 0; i < active.length; i++) { list += '<li>' + esc(active[i].msg || active[i].rule || 'alarm') + '</li>'; }
    } else if (offline) {
      s.className = 'status warn'; $('sbig').innerHTML = 'No data from heater';
    } else {
      s.className = 'status ok'; $('sbig').innerHTML = 'All OK';
    }
    $('slist').innerHTML = list;

    var c = alarms && alarms.config, r = c && c.rules;
    var hot = r && r.tempHigh && r.tempHigh.enabled ? r.tempHigh.value : null;
    var cold = r && r.tempLow && r.tempLow.enabled ? r.tempLow.value : null;
    $('temp').innerHTML = num(v.TempCurrent, 1) + '&deg;';
    $('tsub').innerHTML = 'alarm below ' + (cold !== null ? cold : 'off') + ' / above ' + (hot !== null ? hot : 'off') + '<br>' + (c && c.armed ? 'dog mode ON' : 'dog mode off');
    var hz = (v.Thermostat === 0);
    $('tlbl').innerHTML = hz ? 'Pump demand' : 'Target';
    $('tgt').innerHTML = hz ? num(v.TempDesired, 0) : num(v.TempDesired, 1) + '&deg;';
    $('gsub').innerHTML = esc(v.ThermostatMode || '&nbsp;') + (hz ? '<br>' + num(v.PumpFixed, 1) + ' Hz' : '<br>&nbsp;');

    var run = esc((v.RunString || '--').replace(/^\s+|\s+$/g, ''));
    $('tiles').innerHTML =
      trow(tile('Heater', run), tile('Error', esc(v.ErrorString || '--'))) +
      trow(tile('Battery', num(v.InputVoltage, 1), 'V'), tile('Heater body', num(v.TempBody, 0), '&deg;C')) +
      trow(tile('Pump now', num(v.PumpActual, 1), 'Hz'), tile('Pump set', num(v.PumpFixed, 1), 'Hz')) +
      trow(tile('Fan', num(v.FanRPM, 0), 'rpm'), tile('Fuel rate', num(v.FuelRate, 0), 'mL/h')) +
      trow(tile('Humidity', num(v.Humidity, 0), '%'), tile('Pressure', num(v.Pressure, 0), 'hPa')) +
      trow(tile('Fuel used', typeof v.FuelUsage === 'number' ? (v.FuelUsage / 1000).toFixed(2) : '--', 'L'),
           tile('Fuel total', typeof v.TotalFuelUsage === 'number' ? (v.TotalFuelUsage / 1000).toFixed(1) : '--', 'L')) +
      trow(tile('Last data', state ? since(state.lastMsg || 0) : '--'), tile('Alert phones', alarms && alarms.push ? alarms.push.subscribers : '--'));

    var log = (alarms && alarms.log) || [], out = '';
    for (i = 0; i < log.length && i < 5; i++) {
      out += '<li>' + hm(log[i].ts) + ' &middot; ' + esc(log[i].msg || log[i].rule) + '</li>';
    }
    $('log').innerHTML = out || '<li>none</li>';
    var d = new Date();
    $('upd').innerHTML = 'Updated ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    draw();
  }

  function niceStep(span, n) {
    var raw = span / n, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
  }

  function def() {
    var r = cfg && cfg.rules, hz = (lastValues.Thermostat === 0);
    var hot = r && r.tempHigh && r.tempHigh.enabled ? r.tempHigh.value : null;
    var cold = r && r.tempLow && r.tempLow.enabled ? r.tempLow.value : null;
    var bat = r && r.battery && r.battery.enabled ? r.battery.value : null;
    if (curSeries === 'battery') { return { key: 'InputVoltage', color: '#00702e', unit: 'V', dec: 1, lines: [{ v: bat, c: '#c00000', t: 'low' }] }; }
    if (curSeries === 'body') { return { key: 'TempBody', color: '#b23a00', unit: '°C', dec: 0, lines: [] }; }
    if (curSeries === 'pump') { return { key: 'PumpActual', color: '#0a2fa8', unit: 'Hz', dec: 1, lines: [], also: 'PumpFixed', alsoColor: '#b23a00' }; }
    return { key: 'TempCurrent', color: '#b23a00', unit: '°C', dec: 1, lines: [{ v: hot, c: '#c00000', t: 'hot' }, { v: cold, c: '#0a2fa8', t: 'cold' }],
             also: hz ? null : 'TempDesired', alsoColor: '#0a2fa8' };
  }

  function draw() {
    var el = $('chart');
    if (!hist || !hist.series) { el.innerHTML = '<div class="sub">Loading graph...</div>'; return; }
    var d = def(), pts = hist.series[d.key], i, j;
    if (!pts || pts.length < 2) { el.innerHTML = '<div class="sub">No history yet</div>'; return; }
    var extra = d.also ? hist.series[d.also] : null;
    var W = Math.max(320, (el.clientWidth || 680)), H = 330, L = 58, R = 14, T = 14, B = 34;
    var lo = 1e9, hi = -1e9, v;
    for (i = 0; i < pts.length; i++) { v = pts[i][1]; if (v < lo) { lo = v; } if (v > hi) { hi = v; } }
    if (extra) { for (i = 0; i < extra.length; i++) { v = extra[i][1]; if (v < lo) { lo = v; } if (v > hi) { hi = v; } } }
    for (i = 0; i < d.lines.length; i++) {
      v = d.lines[i].v;
      if (v !== null && v < hi + 8 && v > lo - 8) { if (v < lo) { lo = v; } if (v > hi) { hi = v; } }
    }
    var step = niceStep(Math.max(hi - lo, 1), 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    if (hi === lo) { hi = lo + step; }
    var t0 = hist.from, t1 = hist.to;
    function X(t) { return L + (t - t0) / (t1 - t0) * (W - L - R); }
    function Y(c) { return T + (hi - c) / (hi - lo) * (H - T - B); }
    var svg = '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">';
    // horizontal grid + labels
    for (v = lo; v <= hi + step / 2; v += step) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="#999" stroke-width="1"/>' +
             '<text x="' + (L - 8) + '" y="' + (Y(v) + 6).toFixed(1) + '" font-size="18" text-anchor="end" fill="#000">' + v.toFixed(step < 1 ? 1 : 0) + '</text>';
    }
    // vertical grid + time labels
    var tick = curRange === '1h' ? 900000 : curRange === '4h' ? 3600000 : curRange === 'day' ? 6 * 3600000 : 86400000;
    var first = Math.ceil(t0 / tick) * tick, tx;
    if (curRange === 'day' || curRange === 'week') { var dd = new Date(first); dd.setHours(0, 0, 0, 0); first = dd.getTime(); while (first < t0) { first += tick; } }
    for (tx = first; tx <= t1; tx += tick) {
      var xx = X(tx);
      svg += '<line x1="' + xx.toFixed(1) + '" x2="' + xx.toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#999" stroke-width="1"/>' +
             '<text x="' + xx.toFixed(1) + '" y="' + (H - 10) + '" font-size="18" text-anchor="middle" fill="#000">' + (curRange === 'week' ? DAYS[new Date(tx).getDay()] : hm(tx)) + '</text>';
    }
    svg += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="none" stroke="#000" stroke-width="2"/>';
    // alarm limits
    for (i = 0; i < d.lines.length; i++) {
      v = d.lines[i].v;
      if (v !== null && v >= lo && v <= hi) {
        svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="' + d.lines[i].c + '" stroke-width="3" stroke-dasharray="12 7"/>' +
               '<text x="' + (W - R - 6) + '" y="' + (Y(v) - 6).toFixed(1) + '" font-size="17" font-weight="700" text-anchor="end" fill="' + d.lines[i].c + '">' + d.lines[i].t + ' ' + v + '</text>';
      }
    }
    // secondary line (target / pump set), stepped
    if (extra && extra.length) {
      var ln = '';
      for (j = 0; j < extra.length; j++) {
        if (j > 0) { ln += X(extra[j][0]).toFixed(1) + ',' + Y(extra[j - 1][1]).toFixed(1) + ' '; }
        ln += X(extra[j][0]).toFixed(1) + ',' + Y(extra[j][1]).toFixed(1) + ' ';
      }
      svg += '<polyline points="' + ln + '" fill="none" stroke="' + d.alsoColor + '" stroke-width="3" stroke-dasharray="3 5"/>';
    }
    // main line
    var line = '', minI = 0, maxI = 0;
    for (i = 0; i < pts.length; i++) {
      line += X(pts[i][0]).toFixed(1) + ',' + Y(pts[i][1]).toFixed(1) + ' ';
      if (pts[i][1] < pts[minI][1]) { minI = i; }
      if (pts[i][1] > pts[maxI][1]) { maxI = i; }
    }
    svg += '<polyline points="' + line + '" fill="none" stroke="' + d.color + '" stroke-width="4" stroke-linejoin="round"/>';
    // min / max / now markers
    function mark(idx, label, above) {
      var mx = X(pts[idx][0]), my = Y(pts[idx][1]);
      mx = Math.min(Math.max(mx, L + 30), W - R - 30);
      return '<circle cx="' + X(pts[idx][0]).toFixed(1) + '" cy="' + my.toFixed(1) + '" r="5" fill="#fff" stroke="#000" stroke-width="3"/>' +
             '<text x="' + mx.toFixed(1) + '" y="' + (my + (above ? -12 : 24)).toFixed(1) + '" font-size="18" font-weight="700" text-anchor="middle" fill="#000">' + label + '</text>';
    }
    svg += mark(maxI, 'max ' + pts[maxI][1].toFixed(d.dec), true) + mark(minI, 'min ' + pts[minI][1].toFixed(d.dec), false);
    var last = pts[pts.length - 1];
    svg += '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="7" fill="' + d.color + '" stroke="#000" stroke-width="2"/>';
    svg += '</svg>';
    el.innerHTML = svg;
  }

  function buttons(id, list, cur, fn) {
    var out = '', i;
    for (i = 0; i < list.length; i++) {
      out += '<button type="button" data-k="' + list[i][0] + '"' + (list[i][0] === cur ? ' class="on"' : '') + '>' + list[i][1] + '</button>';
    }
    var box = $(id);
    box.innerHTML = out;
    var bs = box.getElementsByTagName('button');
    for (i = 0; i < bs.length; i++) {
      bs[i].onclick = function () { fn(this.getAttribute('data-k')); };
    }
  }
  function tabs() {
    buttons('tabs', SERIES, curSeries, function (k) { curSeries = k; save(); tabs(); draw(); });
    buttons('ranges', RANGES, curRange, function (k) { curRange = k; save(); tabs(); loadHist(); });
  }
  function save() { try { window.localStorage.setItem('kobo-series', curSeries); window.localStorage.setItem('kobo-range', curRange); } catch (e) {} }

  function loadHist() { get('/api/history?range=' + curRange, function (h) { hist = h; draw(); }); }

  function refresh() {
    var state, alarms, left = 2;
    function done() { left--; if (left === 0) { render(state, alarms); } }
    get('/api/state', function (j) { state = j; done(); });
    get('/api/alarms', function (j) { alarms = j; cfg = j && j.config; done(); });
    loadHist();
  }

  function schedule() {
    var sec = parseInt($('every').value, 10) || 30;
    if (timer) { clearInterval(timer); }
    timer = setInterval(function () { if (!document.hidden) { refresh(); } }, sec * 1000);
    try { window.localStorage.setItem('kobo-every', String(sec)); } catch (e) {}
  }

  try {
    var se = window.localStorage.getItem('kobo-every'); if (se) { $('every').value = se; }
    var ss = window.localStorage.getItem('kobo-series'); if (ss) { curSeries = ss; }
    var sr = window.localStorage.getItem('kobo-range'); if (sr) { curRange = sr; }
  } catch (e) {}
  $('every').onchange = schedule;
  $('now').onclick = refresh;
  tabs();
  schedule();
  refresh();
})();
</script>
</body>
</html>
