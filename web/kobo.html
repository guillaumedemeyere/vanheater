<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van Heater (e-reader)</title>
<!-- Plain ES5 page for old e-reader browsers (Kobo): no modules, no fetch, no Promise, no CSS variables, no grid/flex.
     Read-only: temperatures and alarm status. Polls with XMLHttpRequest. High contrast with a few deep colours. -->
<style>
html,body{margin:0;padding:0;background:#fff;color:#000}
body{font:500 22px/1.25 Helvetica,Arial,sans-serif;padding:10px}
.status{border:3px solid #000;border-top-width:12px;padding:6px 12px;margin-bottom:8px}
.status.ok{border-color:#00702e}
.status.warn{border-color:#b35c00}
.status.alarm{border-color:#c00000}
.status .big{font-size:34px;font-weight:700}
.status.ok .big{color:#00702e}
.status.warn .big{color:#b35c00}
.status.alarm .big{color:#c00000}
.status ul{margin:4px 0 0;padding-left:24px}
.top{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:8px}
.top td{border:3px solid #000;border-top:10px solid #b23a00;padding:4px 12px;vertical-align:top;width:50%}
.top td.t2{border-top-color:#0a2fa8}
.top .lbl{font-size:19px;color:#222}
.top .temp{font-size:78px;line-height:1.05;font-weight:700;color:#b23a00}
.top .t2 .temp{color:#0a2fa8}
.top .sub{font-size:19px;color:#222}
table.d{width:100%;border-collapse:collapse;margin-bottom:8px}
table.d td{border-bottom:2px solid #000;padding:5px 4px}
table.d td.v{text-align:right;font-weight:700;padding-right:12px}
table.d td.sep{border-left:2px solid #000}
.chart{border:3px solid #000;margin-bottom:8px;padding:4px 6px}
.chart .lbl{font-size:19px;color:#222}
.log{margin:0 0 8px;padding:0;list-style:none;font-size:19px}
.log li{border-bottom:1px solid #000;padding:3px 2px}
.foot{font-size:19px;color:#222}
select,button{font:600 19px Helvetica,Arial,sans-serif;border:3px solid #000;background:#fff;color:#000;padding:4px 8px;margin-left:6px}
button{background:#0a2fa8;color:#fff;border-color:#0a2fa8}
</style>
</head>
<body>
<div id="status" class="status warn"><div class="big" id="sbig">Loading...</div><ul id="slist"></ul></div>
<table class="top"><tr>
  <td><div class="lbl">Cabin</div><div class="temp" id="temp">--</div><div class="sub" id="tsub">&nbsp;</div></td>
  <td class="t2"><div class="lbl" id="tlbl">Target</div><div class="temp" id="tgt">--</div><div class="sub" id="gsub">&nbsp;</div></td>
</tr></table>
<table class="d" id="rows"></table>
<div class="chart"><div class="lbl" id="l1">Cabin temperature</div><div id="c1"></div></div>
<div class="chart"><div class="lbl" id="l2">Battery voltage</div><div id="c2"></div></div>
<div class="chart"><div class="lbl" id="l3">Heater body temperature</div><div id="c3"></div></div>
<div class="lbl" style="font-size:19px;color:#222">Recent alarm events</div>
<ul class="log" id="log"></ul>
<div class="foot">
  <span id="upd">not updated yet</span><br>
  Graphs
  <select id="range"><option value="1h">1 h</option><option value="4h" selected>4 h</option><option value="day">24 h</option><option value="week">7 days</option></select>
  Update every
  <select id="every"><option value="15">15 s</option><option value="30">30 s</option><option value="60">1 min</option><option value="300">5 min</option></select>
  <button id="now" type="button">Now</button>
</div>
<script>
(function () {
  var timer = null;
  var cfg = null;

  function $(id) { return document.getElementById(id); }
  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var j = null;
      if (x.status === 200) { try { j = JSON.parse(x.responseText); } catch (e) { j = null; } }
      cb(j);
    };
    x.send();
  }
  function num(v, d) { return (typeof v === 'number') ? v.toFixed(d) : '--'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function pad(n) { return ('0' + n).slice(-2); }
  function hm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function cell(k, v, sep) { return '<td' + (sep ? ' class="sep"' : '') + '>' + k + '</td><td class="v">' + v + '</td>'; }
  function pair(a, b) { return '<tr>' + cell(a[0], a[1], false) + cell(b[0], b[1], true) + '</tr>'; }
  function since(ms) {
    var s = Math.max(0, Math.round((new Date().getTime() - ms) / 1000));
    if (s < 90) { return s + ' s ago'; }
    if (s < 5400) { return Math.round(s / 60) + ' min ago'; }
    return Math.round(s / 3600) + ' h ago';
  }

  function render(state, alarms) {
    var v = (state && state.values) || {};
    var age = state ? (new Date().getTime() - (state.lastMsg || 0)) / 1000 : 1e9;
    var offline = !state || !state.online || age > 300;
    var active = (alarms && alarms.active) || [];
    var s = $('status'), list = '', i;
    if (!state) {
      s.className = 'status warn'; $('sbig').innerHTML = 'Server not reachable';
    } else if (active.length) {
      s.className = 'status alarm'; $('sbig').innerHTML = 'ALARM';
      for (i = 0; i < active.length; i++) { list += '<li>' + esc(active[i].msg || active[i].rule || 'alarm') + '</li>'; }
    } else if (offline) {
      s.className = 'status warn'; $('sbig').innerHTML = 'No data from heater';
    } else {
      s.className = 'status ok'; $('sbig').innerHTML = 'All OK';
    }
    $('slist').innerHTML = list;

    var c = alarms && alarms.config, r = c && c.rules;
    var hot = r && r.tempHigh && r.tempHigh.enabled ? r.tempHigh.value : null;
    var cold = r && r.tempLow && r.tempLow.enabled ? r.tempLow.value : null;
    $('temp').innerHTML = num(v.TempCurrent, 1) + '&deg;C';
    $('tsub').innerHTML = (cold !== null ? 'low ' + cold : 'low off') + ' / ' + (hot !== null ? 'high ' + hot : 'high off') + '&deg;C &middot; ' + (c && c.armed ? 'dog mode ON' : 'dog mode off');

    var hz = (v.Thermostat === 0);
    $('tlbl').innerHTML = hz ? 'Pump demand' : 'Target';
    $('tgt').innerHTML = hz ? num(v.TempDesired, 0) : num(v.TempDesired, 1) + '&deg;C';
    $('gsub').innerHTML = esc(v.ThermostatMode || '') + (hz ? ' &middot; ' + num(v.PumpFixed, 1) + ' Hz' : '');

    var run = esc((v.RunString || '--').replace(/^\s+|\s+$/g, ''));
    $('rows').innerHTML =
      pair(['Heater', run], ['Error', esc(v.ErrorString || '--')]) +
      pair(['Battery', num(v.InputVoltage, 1) + ' V'], ['Heater body', num(v.TempBody, 0) + '&deg;C']) +
      pair(['Pump now', num(v.PumpActual, 1) + ' Hz'], ['Pump set', num(v.PumpFixed, 1) + ' Hz']) +
      pair(['Fan', num(v.FanRPM, 0) + ' rpm'], ['Fuel rate', num(v.FuelRate, 0) + ' mL/h']) +
      pair(['Humidity', num(v.Humidity, 0) + ' %'], ['Pressure', num(v.Pressure, 0) + ' hPa']) +
      pair(['Fuel used', typeof v.FuelUsage === 'number' ? (v.FuelUsage / 1000).toFixed(2) + ' L' : '--'],
           ['Fuel total', typeof v.TotalFuelUsage === 'number' ? (v.TotalFuelUsage / 1000).toFixed(1) + ' L' : '--']) +
      pair(['Sensor 1', num(v.Temp1Current, 1) + '&deg;C'], ['Sensor 4', num(v.Temp4Current, 1) + '&deg;C']) +
      pair(['Last data', state ? since(state.lastMsg || 0) : '--'], ['Notified phones', alarms && alarms.push ? alarms.push.subscribers : '--']);

    var log = (alarms && alarms.log) || [], out = '';
    for (i = 0; i < log.length && i < 5; i++) {
      out += '<li>' + hm(log[i].ts) + ' &middot; ' + esc(log[i].msg || log[i].rule) + '</li>';
    }
    $('log').innerHTML = out || '<li>none</li>';
    var d = new Date();
    $('upd').innerHTML = 'Updated ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function chart(el, h, key, color, lines, dec) {
    var pts = h && h.series && h.series[key];
    if (!pts || pts.length < 2) { el.innerHTML = '<div class="foot">No history yet</div>'; return; }
    var W = Math.max(300, el.clientWidth || 680), H = 150, L = 44, i, lo = 1e9, hi = -1e9;
    for (i = 0; i < pts.length; i++) { if (pts[i][1] < lo) { lo = pts[i][1]; } if (pts[i][1] > hi) { hi = pts[i][1]; } }
    for (i = 0; i < lines.length; i++) {
      if (lines[i].v !== null && lines[i].v < hi + 6 && lines[i].v > lo - 6) { lo = Math.min(lo, lines[i].v); hi = Math.max(hi, lines[i].v); }
    }
    if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
    var t0 = h.from, t1 = h.to;
    function X(t) { return L + (t - t0) / (t1 - t0) * (W - L - 6); }
    function Y(c) { return H - 20 - (c - lo) / (hi - lo) * (H - 20 - 8); }
    var line = '';
    for (i = 0; i < pts.length; i++) { line += X(pts[i][0]).toFixed(1) + ',' + Y(pts[i][1]).toFixed(1) + ' '; }
    var svg = '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="' + L + '" y="8" width="' + (W - L - 6) + '" height="' + (H - 28) + '" fill="none" stroke="#000" stroke-width="2"/>';
    for (i = 0; i < lines.length; i++) {
      if (lines[i].v !== null && lines[i].v >= lo && lines[i].v <= hi) {
        svg += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + Y(lines[i].v).toFixed(1) + '" y2="' + Y(lines[i].v).toFixed(1) + '" stroke="' + lines[i].c + '" stroke-width="3" stroke-dasharray="10 6"/>';
      }
    }
    svg += '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="3"/>' +
      '<text x="2" y="20" font-size="16" fill="#000">' + hi.toFixed(dec) + '</text>' +
      '<text x="2" y="' + (H - 24) + '" font-size="16" fill="#000">' + lo.toFixed(dec) + '</text>' +
      '<text x="' + L + '" y="' + (H - 4) + '" font-size="16" fill="#000">' + hm(t0) + '</text>' +
      '<text x="' + (W - 50) + '" y="' + (H - 4) + '" font-size="16" fill="#000">' + hm(t1) + '</text></svg>';
    el.innerHTML = svg;
  }

  function charts(h) {
    var r = cfg && cfg.rules;
    var hot = r && r.tempHigh && r.tempHigh.enabled ? r.tempHigh.value : null;
    var cold = r && r.tempLow && r.tempLow.enabled ? r.tempLow.value : null;
    var bat = r && r.battery && r.battery.enabled ? r.battery.value : null;
    chart($('c1'), h, 'TempCurrent', '#b23a00', [{ v: hot, c: '#c00000' }, { v: cold, c: '#0a2fa8' }], 1);
    chart($('c2'), h, 'InputVoltage', '#00702e', [{ v: bat, c: '#c00000' }], 1);
    chart($('c3'), h, 'TempBody', '#0a2fa8', [], 0);
  }

  function refresh() {
    var state, alarms, left = 2;
    function done() { left--; if (left === 0) { render(state, alarms); } }
    get('/api/state', function (j) { state = j; done(); });
    get('/api/alarms', function (j) {
      alarms = j; cfg = j && j.config; done();
      get('/api/history?range=' + $('range').value, charts);   // after the alarm limits are known
    });
  }

  function schedule() {
    var sec = parseInt($('every').value, 10) || 30;
    if (timer) { clearInterval(timer); }
    timer = setInterval(function () { if (!document.hidden) { refresh(); } }, sec * 1000);
    try { window.localStorage.setItem('kobo-every', String(sec)); window.localStorage.setItem('kobo-range', $('range').value); } catch (e) {}
  }

  try {
    var se = window.localStorage.getItem('kobo-every'); if (se) { $('every').value = se; }
    var sr = window.localStorage.getItem('kobo-range'); if (sr) { $('range').value = sr; }
  } catch (e) {}
  $('every').onchange = schedule;
  $('range').onchange = function () { schedule(); refresh(); };
  $('now').onclick = refresh;
  schedule();
  refresh();
})();
</script>
</body>
</html>
