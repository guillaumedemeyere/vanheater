<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Van Heater</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css?v=7">
</head>
<body data-state="unknown">
<header>
  <h1>Van Heater</h1>
  <div class="head-right">
    <a href="/settings.html" class="pill" id="setlink">Settings</a>
    <span id="conn" class="pill">connecting…</span>
    <select id="theme" aria-label="Theme">
      <option value="auto">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="ember">Ember</option>
    </select>
  </div>
</header>

<main>
  <section class="hero card">
    <div class="label">Cabin temperature</div>
    <div class="big"><span id="temp">--.-</span><small>°C</small></div>
    <div class="sub">Target <b id="target">--</b>°C · <span id="runstring" class="chip">—</span></div>
    <div id="alert" class="alert" hidden></div>
  </section>

  <section class="grid">
    <div class="card"><div class="label">Battery</div><div class="val"><span id="volt">--</span> V</div></div>
    <div class="card"><div class="label">Heater body</div><div class="val"><span id="body">--</span> °C</div></div>
    <div class="card"><div class="label">Fan</div><div class="val"><span id="fan">--</span> rpm</div></div>
    <div class="card"><div class="label">Pump</div><div class="val"><span id="pump">--</span> Hz</div><div class="sub2"><span id="fuel">--</span> L/h</div>
      <div class="sub2">Used <span id="used">--</span> L · Total <span id="total">--</span> L</div></div>
    <div class="card"><div class="label">Humidity</div><div class="val"><span id="hum">--</span> %</div></div>
    <div class="card"><div class="label">Error</div><div class="val small" id="err">--</div></div>
  </section>

  <section class="card">
    <div class="row"><div class="label">History</div>
      <div class="seg" id="ranges" role="group" aria-label="Chart range">
        <button type="button" data-r="1h">1h</button><button type="button" data-r="4h">4h</button><button type="button" data-r="1d">Day</button><button type="button" data-r="7d">Week</button>
      </div></div>
    <svg id="chart" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
    <div class="axis"><span id="axL"></span><span id="axR"></span></div>
    <div class="legend"><span class="l-temp">Cabin</span><span class="l-target">Target</span></div>
  </section>
  <section class="card" id="controls" hidden>
    <div class="row"><div class="label">Controls</div><span id="dryrun" class="pill" hidden>dry run: nothing is sent</span></div>
    <div class="row gap">
      <button id="startbtn" class="btn primary" type="button">Start heater</button>
      <button id="stopbtn" class="btn" type="button">Stop heater</button>
    </div>
    <div class="setp">
      <button id="spdn" class="btn" type="button" aria-label="Lower target">&minus;</button>
      <div class="spval"><span id="spv">--</span><small>°C target</small><div id="spmsg" class="hint"></div></div>
      <button id="spup" class="btn" type="button" aria-label="Raise target">+</button>
    </div>
    <div class="row gap"><button id="fuelreset" class="btn" type="button">Reset &ldquo;Used&rdquo; fuel counter</button><span id="cmdmsg" class="hint"></span></div>
  </section>

  <dialog id="dlg"><form method="dialog"><p id="dlgtext"></p>
    <div class="row gap"><button class="btn" value="no">Cancel</button><button class="btn primary" value="yes" id="dlgok">Confirm</button></div></form></dialog>

  <section class="card" id="alarms" hidden>
    <div class="row"><div class="label">Alarms</div><span id="armstate" class="pill">—</span></div>
    <div id="activelist"></div>
    <div class="row gap">
      <button id="armbtn" class="btn primary" type="button">Arm dog mode</button>
      <button id="pushbtn" class="btn" type="button">Enable notifications</button>
      <button id="testbtn" class="btn" type="button" hidden>Send test</button>
    </div>
    <div id="pushmsg" class="hint"></div>
    <details id="settings"><summary>Alarm settings</summary>
      <form id="form" autocomplete="off"></form>
      <div class="row gap"><button id="savebtn" class="btn primary" type="button" hidden>Save</button><span id="savemsg" class="hint"></span></div>
    </details>
    <div id="loginbox" class="row gap" hidden>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginbtn" class="btn primary" type="button">Log in</button>
      <span id="loginmsg" class="hint"></span>
    </div>
    <div class="row gap"><button id="authbtn" class="btn link" type="button">Log in to change settings</button></div>
    <details><summary>Recent alerts</summary><ul id="alertlog" class="log"></ul></details>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script src="/legacy/app.js?v=7" type="module"></script>
<script src="/legacy/alarms.js?v=7" type="module"></script>
<script src="/legacy/controls.js?v=7" type="module"></script>
</body>
</html>
