<!doctype html>
<html lang="en" data-theme="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van Heater – interactive mock-up</title>
<style>
:root{
  --bg:#120a07;--bg2:#190e0a;--card:#1f130d;--line:#36211a;--text:#f3ede7;--muted:#a1958b;
  --ember:#ff6a2b;--temp:#ff7d4a;--target:#5aa9e6;--ok:#34b36a;--warn:#f5b301;--bad:#e24c3b;--accent:var(--ember);
  --radius:18px;--shadow:0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="dark"]{--bg:#111315;--bg2:#161a1d;--card:#1c2125;--line:#2b3238;--text:#eef1f3;--muted:#94a0a8;--ember:#ff7a45}
:root[data-theme="light"]{--bg:#f4f1ec;--bg2:#ece7e0;--card:#ffffff;--line:#e3dcd3;--text:#1d1a17;--muted:#7a716a;--ember:#e8531b;--temp:#d4501e;--shadow:0 6px 18px rgba(60,40,20,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 70% -10%,var(--bg2),var(--bg));background-attachment:fixed;color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
/* ---------- navigation: bottom bar on mobile, sidebar on desktop ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;
  color:var(--muted);font-size:.68rem;min-width:56px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.brand{display:none}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.top h1{font-size:1.15rem;margin:0;letter-spacing:.02em;white-space:nowrap}
.top h1 .pre{display:none}
@media (min-width:600px){.top h1 .pre{display:inline}}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:.72rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.on{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.pill.acc{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.lbl{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.val{font-size:1.45rem;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.val small,.unit{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:3px}
.sub{color:var(--muted);font-size:.85rem}
.grid{display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles .card{padding:12px 12px}
.stack{display:grid;gap:12px}
.two{display:grid;gap:12px;grid-template-columns:1fr}
.btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 16px;font-size:.92rem}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.btn.d{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));color:var(--bad)}
.btn.round{width:52px;height:52px;border-radius:50%;padding:0;font-size:1.6rem;line-height:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:6px 12px;font-size:.8rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
svg text{fill:var(--muted);font-size:10px}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl .sp{min-width:96px;text-align:center}
.ctl .sp b{font-size:2rem;font-variant-numeric:tabular-nums}
/* hero (classic) */
.hero{text-align:center;border-top:4px solid var(--accent);padding:22px 16px}
.hero .big{font-size:clamp(3.6rem,15vw,5.2rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:1.5rem;color:var(--muted);margin-left:4px}
.banner{margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--bad);color:#fff;font-weight:600;text-align:left}
/* gauge */
.gaugebox{position:relative;max-width:360px;margin:0 auto}
.gaugebox .mid{position:absolute;left:0;right:0;top:34%;text-align:center}
.gaugebox .mid .big{font-size:clamp(3rem,13vw,4.4rem);font-weight:700;line-height:1}
/* dog */
.status{border-radius:var(--radius);padding:18px 18px 16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);border-top:5px solid var(--ok)}
.status.warn{border-top-color:var(--warn)} .status.alarm{border-top-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.status h2{font-size:clamp(2.2rem,9vw,3rem);margin:6px 0 2px;line-height:1.05}
.rangebar{position:relative;height:40px;margin-top:14px}
.rangebar .track{position:absolute;top:15px;left:0;right:0;height:10px;border-radius:6px}
.rangebar .mark{position:absolute;top:5px;width:5px;height:30px;border-radius:3px;background:var(--text);transform:translateX(-50%);box-shadow:0 0 0 3px color-mix(in srgb,var(--bg) 70%,transparent);transition:left .5s}
.rangelab{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
details>summary{cursor:pointer;color:var(--muted);font-size:.85rem;list-style:none}
details>summary{display:block}
details>summary::-webkit-details-marker{display:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:10px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:.88rem}
.kv span{color:var(--muted)}
/* history */
.chartwrap{position:relative;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:.78rem;box-shadow:var(--shadow);transform:translate(-50%,-110%);white-space:nowrap;display:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
/* demo + sheets */
.demo{position:relative;z-index:30}
.demo>button{background:var(--card);border:1px dashed var(--muted);border-radius:99px;padding:4px 10px;font-size:.72rem;color:var(--muted)}
.demo .pop{position:absolute;right:0;top:34px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:none;gap:6px;width:210px;box-shadow:var(--shadow)}
.demo.open .pop{display:grid}
.demo .pop button{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-align:left;font-size:.85rem}
.demo .pop .t{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);max-width:340px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)} dialog p{white-space:pre-line;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none}
.toast.show{opacity:1}
.sheet label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);margin-top:10px}
.sheet input[type=number],.sheet select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
@media (min-width:900px){
  .app{grid-template-columns:230px 1fr}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);
    padding:22px 12px;background:var(--card);backdrop-filter:none}
  .brand{display:block;font-weight:700;letter-spacing:.03em;padding:4px 10px 18px;font-size:1.05rem}
  .brand i{color:var(--accent);font-style:normal}
  .nav button{flex-direction:row;gap:12px;font-size:.92rem;padding:11px 12px;min-width:0;justify-content:flex-start;width:100%}
  main{max-width:1060px;padding:24px 28px 40px}
  .toast{bottom:40px}
  .two{grid-template-columns:1.15fr 1fr;align-items:start}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tiles.six{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Layouts"></nav>
  <main>
    <div class="top"><h1 id="title">Van Heater</h1>
      <div class="chips"><div class="demo" id="demo"><button id="demobtn">Simulate…</button>
  <div class="pop"><div class="t">Demo scenario</div>
    <button data-s="normal">✅ Normal</button><button data-s="hot">🔥 Too hot (31.5°)</button><button data-s="cold">🥶 Too cold (8.9°)</button>
    <button data-s="offline">📡 Heater offline</button><button data-s="error">⚠️ Heater error</button><button data-s="battery">🔋 Low battery</button></div></div><span class="pill" id="armpill"></span><span class="pill ok" id="livepill">live</span>
        <button class="pill" id="gear" aria-label="Settings">⚙ Settings</button></div></div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog"><p id="dlgtext"></p><div class="row"><button class="btn" value="no">Cancel</button><button class="btn p" value="yes" id="dlgok">Confirm</button></div></form></dialog>
<dialog id="sheet" class="sheet"><form method="dialog">
  <div class="lbl">Settings (mock-up)</div>
  <label>Theme<select id="theme"><option value="ember">Ember</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
  <label>Too hot above (°C)<input type="number" id="hot" step="0.5"></label>
  <label>Too cold below (°C)<input type="number" id="cold" step="0.5"></label>
  <div class="row" style="margin-top:14px"><button class="btn" value="x">Close</button><a class="sub" href="#" onclick="return false">Advanced settings →</a></div></form></dialog>
<div class="toast" id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{return localStorage.getItem(k)||d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

/* ---------------- simulated state ---------------- */
const S={cabin:19.7,target:14,run:'Running',batt:13.4,body:203,fan:2060,pump:1.9,hum:19,err:'E-00: OK',armed:true,online:true,
  hot:30,cold:10,battMin:11.8,range:'4h',metric:'temp',silenced:false,mode:store.get('mode','classic')};
const RANGES={'1h':3600e3,'4h':4*3600e3,'1d':864e5,'7d':7*864e5};
const H={t:[],cabin:[],target:[],batt:[],body:[]};
(function gen(){const now=Date.now(),step=5*60e3;let c=18.5;
  for(let t=now-7*864e5;t<=now;t+=step){const d=(t%864e5)/864e5;
    const tgt=(t>now-30*60e3)?14:(d>.3&&d<.85?19:15);
    c+=((tgt+3.6)-c)*.04+(Math.random()-.5)*.25;
    H.t.push(t);H.cabin.push(+c.toFixed(2));H.target.push(tgt);
    H.batt.push(+(13.2+Math.sin(t/3.2e6)*.35+(Math.random()-.5)*.08).toFixed(2));H.body.push(Math.round(190+(tgt-14)*5+Math.sin(t/9e5)*8));}
  S.cabin=H.cabin.at(-1);})();

const alarms=()=>{const a=[];
  if(S.cabin>S.hot)a.push({k:'hot',t:'Too hot',m:`Cabin ${S.cabin.toFixed(1)}°C (limit ${S.hot}°C)`});
  if(S.cabin<S.cold)a.push({k:'cold',t:'Too cold',m:`Cabin ${S.cabin.toFixed(1)}°C (limit ${S.cold}°C)`});
  if(!S.online)a.push({k:'off',t:'Heater offline',m:'No data from the heater'});
  if(!S.err.startsWith('E-00'))a.push({k:'err',t:'Heater error',m:S.err});
  if(S.batt<S.battMin)a.push({k:'batt',t:'Low battery',m:`Battery ${S.batt.toFixed(1)} V (limit ${S.battMin} V)`});
  return a;};
const level=()=>{const a=alarms();if(a.length)return 'alarm';
  return (S.cabin>S.hot-2||S.cabin<S.cold+2)?'warn':'ok';};
const accent=()=>alarms().length?'var(--bad)':S.run==='Running'?'var(--ember)':S.run==='Cooling'?'var(--target)':'var(--muted)';
const f1=v=>(+v).toFixed(1);

/* ---------------- helpers ---------------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function confirmDlg(text,ok){return new Promise(r=>{const d=$('#dlg');$('#dlgtext').textContent=text;$('#dlgok').textContent=ok;d.onclose=()=>r(d.returnValue==='yes');d.returnValue='no';d.showModal()})}
async function doStart(){if(await confirmDlg(`Heater state: ${S.run}.\n\nStart the heater?`,'Yes, start')){S.run='Running';toast('Start sent (mock-up, nothing real)');render()}}
async function doStop(){if(await confirmDlg(`Heater state: ${S.run}.\n\nStop the heater?`+(S.armed?' Dog mode is armed: the cabin will cool and the cold alarm may trigger.':''),'Yes, stop')){S.run='Cooling';toast('Stop sent (mock-up, nothing real)');render()}}
function bump(d){S.target=Math.min(35,Math.max(8,S.target+d));toast(`Target ${S.target}°C (mock-up)`);update()}
const ctlHTML=()=>`<div class="ctl"><button class="btn round" data-a="dn" aria-label="Lower target">−</button><div class="sp"><b data-b="target">${S.target}</b>°C<div class="lbl">target</div></div><button class="btn round" data-a="up" aria-label="Raise target">+</button></div>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn p" data-a="start">Start heater</button><button class="btn" data-a="stop">Stop heater</button></div>`;

/* downsample to ~N points */
function series(key,range,n=240){const from=Date.now()-RANGES[range],out=[];let acc=[],b=-1;
  const size=RANGES[range]/n;
  for(let i=0;i<H.t.length;i++){if(H.t[i]<from)continue;const bi=Math.floor((H.t[i]-from)/size);
    if(bi!==b&&acc.length){out.push([from+(b+.5)*size,acc.reduce((a,c)=>a+c,0)/acc.length]);acc=[]}b=bi;acc.push(H[key][i])}
  if(acc.length)out.push([from+(b+.5)*size,acc.reduce((a,c)=>a+c,0)/acc.length]);return out}
function path(pts,x,y){return pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join('')}
function lineChart({w,h,range,lines,bands=[],pad=[34,10,14,22],el}){
  w=Math.max(260,Math.round((el&&el.clientWidth)||w));
  const [pl,pr,pt,pb]=pad,from=Date.now()-RANGES[range],to=Date.now();
  const all=lines.flatMap(l=>l.pts.map(p=>p[1]));bands.forEach(b=>all.push(b.from,b.to));
  let lo=Math.min(...all),hi=Math.max(...all);const m=(hi-lo)*.1||1;lo-=m;hi+=m;
  const x=t=>pl+(t-from)/(to-from)*(w-pl-pr), y=v=>h-pb-(v-lo)/(hi-lo)*(h-pt-pb);
  let s='';
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,yy=y(v);s+=`<line x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="4" y="${yy+3}">${v.toFixed(lines[0].dec??0)}</text>`}
  bands.forEach(b=>{const y1=Math.max(pt,y(b.to)),y2=Math.min(h-pb,y(b.from));if(y2>y1)s+=`<rect x="${pl}" y="${y1}" width="${w-pl-pr}" height="${y2-y1}" fill="${b.color}"/>`});
  lines.forEach(l=>{s+=`<path d="${path(l.pts,x,y)}" fill="none" stroke="${l.color}" stroke-width="${l.width||2.5}" stroke-linejoin="round" ${l.dash?'stroke-dasharray="6 4"':''} vector-effect="non-scaling-stroke"/>`});
  const fmt=t=>new Date(t).toLocaleString([],range==='7d'?{weekday:'short',hour:'2-digit',minute:'2-digit'}:{hour:'2-digit',minute:'2-digit'});
  s+=`<text x="${pl}" y="${h-4}">${fmt(from)}</text><text x="${w-pr}" y="${h-4}" text-anchor="end">${fmt(to)}</text>`;
  return {w,svg:`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;max-width:100%">${s}</svg>`,x,y,from,to,lines};
}
const limitBands=()=>[{from:S.cold,to:S.hot,color:'color-mix(in srgb,var(--ok) 9%,transparent)'}];
const rangeSeg=()=>`<div class="seg" data-seg="range">${Object.keys(RANGES).map(r=>`<button data-r="${r}" class="${S.range===r?'on':''}">${{'1h':'1h','4h':'4h','1d':'Day','7d':'Week'}[r]}</button>`).join('')}</div>`;
const tempChart=(w,h,el)=>lineChart({w,h,el,range:S.range,bands:limitBands(),lines:[
  {pts:series('target',S.range),color:'var(--target)',dash:1,width:2,dec:0},{pts:series('cabin',S.range),color:'var(--temp)',dec:0}]});

/* ---------------- views ---------------- */
const tile=(l,v,u='',id='')=>`<div class="card"><div class="lbl">${l}</div><div class="val"><span ${id}>${v}</span><small>${u}</small></div></div>`;
const alertsHTML=()=>alarms().map(a=>`<div class="banner">${a.t}: ${a.m}</div>`).join('');

const VIEWS={
classic:{title:'Classic',html:()=>`<div class="stack">
  <div class="two"><div class="stack">
    <section class="card hero"><div class="lbl">Cabin temperature</div><div class="big"><span data-b="cabin">${f1(S.cabin)}</span><small>°C</small></div>
      <div class="sub">Target <b style="color:var(--text)" data-b="target">${S.target}</b>°C · <span class="pill acc" data-b="run">${S.online?S.run:'Offline'}</span></div><div data-b="banners">${alertsHTML()}</div></section>
    <div class="tiles six">${tile('Battery',f1(S.batt),'V','data-b="batt"')}${tile('Heater body',S.body,'°C','data-b="body"')}${tile('Fan',S.fan,'rpm','data-b="fan"')}
      ${tile('Pump',f1(S.pump),'Hz')}${tile('Humidity',S.hum,'%','data-b="hum"')}<div class="card"><div class="lbl">Error</div><div class="val" style="font-size:.95rem" data-b="err">${S.err}</div></div></div>
  </div><div class="stack">
    <section class="card"><div class="row between"><div class="lbl">History</div>${rangeSeg()}</div><div data-b="chart" style="margin-top:8px"></div></section>
    <section class="card"><div class="lbl" style="margin-bottom:10px">Controls</div>${ctlHTML()}</section>
  </div></div></div>`,
  upd(){const el=$('[data-b=chart]');el.innerHTML=tempChart(600,230,el).svg}},

gauge:{title:'Gauge',html:()=>`<div class="stack"><div class="two"><div class="stack">
  <section class="card" style="padding-bottom:18px"><div class="gaugebox"><div data-b="gauge"></div>
    <div class="mid"><div class="big"><span data-b="cabin">${f1(S.cabin)}</span><small class="unit" style="font-size:1.1rem">°C</small></div>
    <div class="sub">target <b style="color:var(--target)" data-b="target">${S.target}°</b></div><div style="margin-top:8px"><span class="pill acc" data-b="run">${S.run}</span></div></div></div>
    <div data-b="banners">${alertsHTML()}</div></section>
  <section class="card">${ctlHTML()}</section></div><div class="stack">
  <div class="tiles">${tile('Battery',f1(S.batt),'V','data-b="batt"')}${tile('Pump',f1(S.pump),'Hz')}${tile('Humidity',S.hum,'%','data-b="hum"')}</div>
  <section class="card"><div class="row between"><div class="lbl">History</div>${rangeSeg()}</div><div data-b="chart" style="margin-top:6px"></div></section></div></div></div>`,
  upd(){
    const R=112,cx=150,cy=150,a0=-210,a1=30,lo=8,hi=35,P=(a,r=R)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
    const ang=v=>a0+(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*(a1-a0);
    const arc=(from,to,r=R)=>{const [x1,y1]=P(ang(from),r),[x2,y2]=P(ang(to),r);return `M${x1} ${y1} A${r} ${r} 0 ${Math.abs(ang(to)-ang(from))>180?1:0} 1 ${x2} ${y2}`};
    const [tx,ty]=P(ang(S.target)),[ex,ey]=P(ang(S.cabin));let ticks='';
    for(let v=10;v<=35;v+=5){const [x,y]=P(ang(v),R+22);ticks+=`<text x="${x}" y="${y+3}" text-anchor="middle">${v}°</text>`}
    $('[data-b=gauge]').innerHTML=`<svg viewBox="0 0 300 240" width="100%"><path d="${arc(lo,hi)}" fill="none" stroke="var(--line)" stroke-width="18" stroke-linecap="round"/>
      <path d="${arc(S.cold,S.hot)}" fill="none" stroke="color-mix(in srgb,var(--ok) 28%,transparent)" stroke-width="18"/>
      <path d="${arc(lo,Math.max(lo+.1,S.cabin))}" fill="none" stroke="${accent()}" stroke-width="18" stroke-linecap="round" style="transition:d .6s"/>
      <circle cx="${tx}" cy="${ty}" r="9" fill="var(--target)" stroke="var(--bg)" stroke-width="3"/>${ticks}</svg>`;
    const el=$('[data-b=chart]');el.innerHTML=tempChart(500,170,el).svg}},

dog:{title:'Dog',html:()=>`<div class="stack"><div class="two"><div class="stack">
  <section class="status" data-b="status"></section>
  <div class="row"><button class="btn" data-a="silence" style="flex:1" id="silbtn">Silence alarms 1 h</button><button class="btn" data-a="arm" style="flex:1" id="armbtn">Disarm</button></div>
  <section class="card"><details><summary><div class="row between" style="display:inline-flex;width:100%"><span><span class="lbl">Heater</span> <b style="color:var(--text)" data-b="hsum"></b></span><span class="pill">details ▾</span></div></summary>
    <div class="kv"><div><span>Battery</span><b data-b="batt">${f1(S.batt)} V</b></div><div><span>Body</span><b>${S.body}°C</b></div><div><span>Fan</span><b>${S.fan} rpm</b></div><div><span>Pump</span><b>${f1(S.pump)} Hz</b></div><div><span>Humidity</span><b>${S.hum} %</b></div><div><span>Error</span><b data-b="err">${S.err}</b></div></div>
    <div style="margin-top:14px">${ctlHTML()}</div></details></section>
  </div><div class="stack"><section class="card"><div class="row between"><div class="lbl">Cabin · history</div>${rangeSeg()}</div><div data-b="chart" style="margin-top:6px"></div>
    <div class="sub" style="margin-top:6px">Green band = safe range (${'<span data-b="lims"></span>'})</div></section></div></div></div>`,
  upd(){const lv=level(),a=alarms(),st=$('[data-b=status]');
    const head=a.length?a[0].t.toUpperCase()+(a.length>1?` +${a.length-1}`:''):lv==='warn'?'Getting close':'All OK';
    st.className='status '+(lv==='ok'?'':lv);
    const span=Math.max(S.hot-S.cold,1),pos=Math.min(100,Math.max(0,(S.cabin-(S.cold-6))/(S.hot-S.cold+12)*100));
    const w=6/(S.hot-S.cold+12)*100;
    st.innerHTML=`<div class="row between"><span class="lbl">Dog mode</span><span class="pill ${S.armed?'on':''}">${S.armed?'ARMED':'Disarmed'}</span></div>
      <h2>${head}</h2><div class="sub">${a.length?a.map(x=>x.m).join(' · '):`Cabin ${f1(S.cabin)}°C · heater data ${S.online?'4 s ago':'LOST'} · battery ${f1(S.batt)} V`}</div>
      <div class="rangebar"><div class="track" style="background:linear-gradient(90deg,var(--bad) 0 ${w*.6}%,var(--warn) ${w*.6}% ${w}%,var(--ok) ${w}% ${100-w}%,var(--warn) ${100-w}% ${100-w*.6}%,var(--bad) ${100-w*.6}%)"></div>
      <div class="mark" style="left:${pos}%"></div></div>
      <div class="rangelab"><span>${S.cold}° cold alarm</span><b style="color:var(--text)">${f1(S.cabin)}°</b><span>${S.hot}° hot alarm</span></div>`;
    $('[data-b=hsum]').textContent=`${S.run} · target ${S.target}°`;$('[data-b=lims]').textContent=`${S.cold}–${S.hot}°C`;
    $('#armbtn').textContent=S.armed?'Disarm':'Arm dog mode';$('#silbtn').textContent=S.silenced?'Alarms silenced (tap to undo)':'Silence alarms 1 h';
    const el=$('[data-b=chart]');el.innerHTML=tempChart(500,200,el).svg}},

history:{title:'History',html:()=>`<div class="stack">
  <div class="row between" style="align-items:flex-end"><div><div class="lbl">Cabin now</div><div class="val" style="font-size:2.6rem"><span data-b="cabin">${f1(S.cabin)}</span><small>°C</small></div></div>
    <div style="text-align:right" class="sub">target <b data-b="target" style="color:var(--text)">${S.target}°</b><br><span class="pill acc" data-b="run">${S.run}</span></div></div>
  <div data-b="banners">${alertsHTML()}</div>
  <div class="row between">${rangeSeg()}<div class="seg" data-seg="metric">${[['temp','Temperature'],['batt','Battery'],['body','Body']].map(([k,l])=>`<button data-m="${k}" class="${S.metric===k?'on':''}">${l}</button>`).join('')}</div></div>
  <section class="card" style="padding:10px"><div class="chartwrap" id="cw"><div data-b="chart"></div><div class="tip" id="tip"></div></div></section>
  <div class="stat" data-b="stats"></div>
  <section class="card"><div class="two" style="align-items:center"><div>${ctlHTML()}</div><div class="tiles" style="margin-top:10px">${tile('Battery',f1(S.batt),'V','data-b="batt"')}${tile('Pump',f1(S.pump),'Hz')}${tile('Humidity',S.hum,'%','data-b="hum"')}</div></div></section></div>`,
  upd(){
    const m=S.metric,W=640,Hh=300;let lines,bands=[],unit='°';
    if(m==='temp'){lines=[{pts:series('target',S.range),color:'var(--target)',dash:1,width:2,dec:0},{pts:series('cabin',S.range),color:'var(--temp)',dec:0}];bands=limitBands()}
    else if(m==='batt'){lines=[{pts:series('batt',S.range),color:'var(--warn)',dec:1}];bands=[{from:S.battMin,to:15,color:'color-mix(in srgb,var(--ok) 9%,transparent)'}];unit=' V'}
    else{lines=[{pts:series('body',S.range),color:'var(--ember)',dec:0}]}
    const el=$('[data-b=chart]'),c=lineChart({w:W,h:Hh,el,range:S.range,lines,bands,pad:[36,10,14,24]});el.innerHTML=c.svg;
    const key=m==='temp'?'cabin':m,pts=lines.at(-1).pts.map(p=>p[1]);
    $('[data-b=stats]').innerHTML=[['Min',Math.min(...pts)],['Average',pts.reduce((a,b)=>a+b,0)/pts.length],['Max',Math.max(...pts)]].map(([l,v])=>`<div class="card"><div class="lbl">${l}</div><div class="val">${v.toFixed(m==='batt'?2:1)}<small>${unit.trim()}</small></div></div>`).join('');
    const cw=$('#cw'),tip=$('#tip'),main=lines.at(-1).pts;
    cw.onpointermove=e=>{const r=cw.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*c.w;let best=null,bd=1e9;
      main.forEach(p=>{const d=Math.abs(c.x(p[0])-px);if(d<bd){bd=d;best=p}});if(!best)return;
      const xx=c.x(best[0])/c.w*r.width,yy=c.y(best[1])+10;tip.style.display='block';tip.style.left=xx+'px';tip.style.top=(yy-4)+'px';
      tip.textContent=`${best[1].toFixed(m==='batt'?2:1)}${unit} · ${new Date(best[0]).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'})}`};
    cw.onpointerleave=()=>tip.style.display='none'}}
};

/* ---------------- shell ---------------- */
const ICONS={classic:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>',
 gauge:'<path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13l4-5"/><circle cx="12" cy="14" r="1.2"/>',
 dog:'<path d="M5 9l-2 3 3 1M19 9l2 3-3 1"/><path d="M7 6c1-2 3-2.5 5-2.5S16 4 17 6l1 7a6 6 0 0 1-12 0z"/><circle cx="10" cy="11" r=".8"/><circle cx="14" cy="11" r=".8"/><path d="M11 14.5h2"/>',
 history:'<path d="M3 20h18"/><path d="M4 15l4-5 4 3 5-7 3 3"/>'};
function buildNav(){$('#nav').innerHTML=`<div class="brand"><i>🔥</i> Van Heater</div>`+Object.entries(VIEWS).map(([k,v])=>
  `<button data-mode="${k}" class="${S.mode===k?'on':''}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${v.title}</span></button>`).join('')}

function render(){document.documentElement.style.setProperty('--accent',accent());
  const v=VIEWS[S.mode];$('#view').innerHTML=v.html();$('#title').innerHTML='<span class="pre">Van Heater · </span>'+v.title;
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  if(matchMedia('(min-width:900px)').matches)$$('#view details').forEach(d=>d.open=true);update()}
function update(){document.documentElement.style.setProperty('--accent',accent());
  $('#armpill').textContent=S.armed?'ARMED':'Disarmed';$('#armpill').className='pill '+(S.armed?'on':'');
  const lp=$('#livepill');lp.textContent=S.online?'live':'offline';lp.className='pill '+(S.online?'ok':'bad');
  const set=(k,v)=>$$(`[data-b="${k}"]`).forEach(e=>e.textContent=v);
  set('cabin',f1(S.cabin));set('target',S.mode==='gauge'||S.mode==='history'?S.target+'°':S.target);set('run',S.online?S.run:'Offline');set('batt',f1(S.batt)+(S.mode==='dog'?' V':''));set('err',S.err);set('hum',S.hum);set('body',S.body);set('fan',S.fan);
  $$('[data-b="banners"]').forEach(e=>e.innerHTML=alertsHTML());
  $$('[data-b="target"]').forEach(e=>{if(e.tagName==='B'&&e.closest('.sp'))e.textContent=S.target});
  VIEWS[S.mode].upd()}

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-mode]');if(n){S.mode=n.dataset.mode;store.set('mode',S.mode);render();scrollTo({top:0});return}
  const r=e.target.closest('[data-r]');if(r){S.range=r.dataset.r;render();return}
  const m=e.target.closest('[data-m]');if(m){S.metric=m.dataset.m;render();return}
  const a=e.target.closest('[data-a]');if(a){({up:()=>bump(1),dn:()=>bump(-1),start:doStart,stop:doStop,
    silence:()=>{S.silenced=!S.silenced;toast(S.silenced?'Repeats silenced for 1 h (mock-up)':'Silence cancelled');update()},
    arm:()=>{S.armed=!S.armed;toast(S.armed?'Dog mode armed':'Dog mode disarmed');update()}})[a.dataset.a]();return}
  if(e.target.closest('#armpill')){S.armed=!S.armed;update();return}
  if(e.target.id==='demobtn'){$('#demo').classList.toggle('open');return}
  const s=e.target.closest('[data-s]');if(s){scenario(s.dataset.s);$('#demo').classList.remove('open');return}
  if(!e.target.closest('#demo'))$('#demo').classList.remove('open')});
$('#gear').onclick=()=>{$('#hot').value=S.hot;$('#cold').value=S.cold;$('#theme').value=document.documentElement.dataset.theme;$('#sheet').showModal()};
$('#theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;store.set('theme',e.target.value);update()};
$('#hot').onchange=e=>{S.hot=+e.target.value;update()};$('#cold').onchange=e=>{S.cold=+e.target.value;update()};
document.documentElement.dataset.theme=store.get('theme','ember');

function scenario(k){Object.assign(S,{online:true,err:'E-00: OK',batt:13.4,run:'Running',silenced:false});
  if(k==='hot')S.cabin=31.5;if(k==='cold'){S.cabin=8.9;S.run='Stopped'}if(k==='offline')S.online=false;
  if(k==='error'){S.err='E-05: Glow plug failure';S.run='Stopped'}if(k==='battery')S.batt=11.2;
  if(k==='normal')S.cabin=19.7;render()}

/* gentle live drift so the mock-up feels alive */
setInterval(()=>{if(!S.online)return;const eq=S.run==='Running'?S.target+4:S.run==='Cooling'?10:10;
  if(alarms().length===0||true){S.cabin+=((S.cabin>S.hot||S.cabin<S.cold)?0:(eq-S.cabin)*.01)+(Math.random()-.5)*.08}
  S.fan+=Math.round((Math.random()-.5)*20);S.batt=Math.max(10,S.batt+(Math.random()-.5)*.02);
  const now=Date.now();if(now-H.t.at(-1)>30e3){H.t.push(now);H.cabin.push(+S.cabin.toFixed(2));H.target.push(S.target);H.batt.push(+S.batt.toFixed(2));H.body.push(S.body)}
  update()},3000);

buildNav();render();
</script>
</body>
</html>
